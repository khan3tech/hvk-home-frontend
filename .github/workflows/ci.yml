name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-guard:
    name: Home page scope guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail if the home page was modified outside the About link reorder (constitution IV)
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base...HEAD" -- app/page.tsx 'components/tech/**' lib/tech-constants.ts)
          unexpected=$(printf '%s\n' "$changed" | grep -vx 'lib/tech-constants.ts' || true)

          if [ -n "$unexpected" ]; then
            echo "::error::The home page is out of scope for portal work. Changed files:"
            echo "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -qx 'lib/tech-constants.ts'; then
            removed=$(git diff --unified=0 "$base...HEAD" -- lib/tech-constants.ts | awk '/^---/ { next } /^-/ { print substr($0, 2) }' | sort)
            added=$(git diff --unified=0 "$base...HEAD" -- lib/tech-constants.ts | awk '/^\+\+\+/ { next } /^\+/ { print substr($0, 2) }' | sort)
            expected=$(printf '%s\n' '{ label: "About HVK", href: "#about" },' '{ label: "About", href: "#about" },' | sort)

            if [ "$removed" != "$expected" ] || [ "$added" != "$expected" ]; then
              echo "::error::The only allowed tech-constants.ts change in portal work is moving About links to the end."
              exit 1
            fi
          fi

  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Playwright (mocked API)
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
