version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.12.0 && nvm use 22.12.0
        - npm install -g npm@11
        - npm ci
    build:
      commands:
        - nvm use 22.12.0
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
