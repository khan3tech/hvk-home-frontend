openapi: 3.1.0
info:
  title: Online Examination API
  version: 1.0.0
  description: |
    Versioned JSON API for the online examination platform. Production identity
    is supplied by the host website authentication adapter. Times are returned
    as UTC ISO-8601 strings; exam dates are interpreted in Asia/Kolkata.
servers:
  - url: http://127.0.0.1:4100/api/v1
    description: Local development
  - url: https://api.example.invalid/api/v1
    description: Production placeholder; replace during deployment
tags:
  - name: Candidate
  - name: Administrator
  - name: Operations
paths:
  /exams:
    get:
      tags: [Candidate]
      summary: List published exams available to candidates
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ExamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exams/{examId}:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    get:
      tags: [Candidate]
      summary: Get public exam metadata and questions
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/PublicExam' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exams/{examId}/attempts:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    post:
      tags: [Candidate]
      summary: Start or retrieve the candidate's single attempt
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OptionalAttemptSession' }]
      responses:
        '200': { $ref: '#/components/responses/Attempt' }
        '201': { $ref: '#/components/responses/Attempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attempts/{attemptId}:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/AttemptSession' }]
    get:
      tags: [Candidate]
      summary: Read an owned attempt
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Attempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attempts/{attemptId}/answers/{questionId}:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/QuestionId' }, { $ref: '#/components/parameters/AttemptSession' }]
    put:
      tags: [Candidate]
      summary: Save one answer with optimistic revision checking
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSaveRequest' }
      responses:
        '200':
          description: Answer accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSaveResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attempts/{attemptId}/monitoring-events:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/AttemptSession' }]
    post:
      tags: [Candidate]
      summary: Record a minimized local monitoring signal
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitoringEventRequest' }
      responses:
        '200':
          description: Monitoring signal recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringEventResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attempts/{attemptId}/submit:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/AttemptSession' }]
    post:
      tags: [Candidate]
      summary: Finalize an attempt manually
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { $ref: '#/components/responses/Attempt' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attempts/{attemptId}/result:
    parameters: [{ $ref: '#/components/parameters/AttemptId' }, { $ref: '#/components/parameters/AttemptSession' }]
    get:
      tags: [Candidate]
      summary: Read a published result
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Published score and qualification only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/exams:
    get:
      tags: [Administrator]
      summary: List exams with admin-only answer flags
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminExamList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administrator]
      summary: Create a draft exam
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamWriteRequest' }
      responses:
        '201': { $ref: '#/components/responses/AdminExam' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/exams/{examId}:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    patch:
      tags: [Administrator]
      summary: Edit an exam before its first attempt
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamWriteRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminExam' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/exams/{examId}/publish:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    post:
      tags: [Administrator]
      summary: Publish a valid draft
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/PublicExam' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/exams/{examId}/archive:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    post:
      tags: [Administrator]
      summary: Archive an exam
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/PublicExam' }
  /admin/exams/{examId}/results:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    get:
      tags: [Administrator]
      summary: View attempt and result summaries
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Admin attempt summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResultsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/exams/{examId}/results/publish:
    parameters: [{ $ref: '#/components/parameters/ExamId' }]
    post:
      tags: [Administrator]
      summary: Publish all calculated results for an exam
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Publication confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [examId, published]
                    properties:
                      examId: { type: string }
                      published: { type: boolean }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: app_session
      description: HttpOnly 24-hour session cookie. The browser sends it automatically; Swagger UI cannot read its value.
  parameters:
    ExamId: { name: examId, in: path, required: true, schema: { type: string } }
    AttemptId: { name: attemptId, in: path, required: true, schema: { type: string } }
    QuestionId: { name: questionId, in: path, required: true, schema: { type: string } }
    AttemptSession: { name: X-Attempt-Session, in: header, required: true, schema: { type: string } }
    OptionalAttemptSession: { name: X-Attempt-Session, in: header, required: false, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
  schemas:
    Option:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    AdminOption:
      allOf:
        - $ref: '#/components/schemas/Option'
        - type: object
          required: [isCorrect]
          properties: { isCorrect: { type: boolean } }
    PublicQuestion:
      type: object
      required: [id, type, prompt, marks, options]
      properties:
        id: { type: string }
        type: { const: SINGLE_CHOICE }
        prompt: { type: string }
        marks: { type: number, exclusiveMinimum: 0 }
        options: { type: array, minItems: 2, items: { $ref: '#/components/schemas/Option' } }
    AdminQuestion:
      allOf:
        - $ref: '#/components/schemas/PublicQuestion'
        - type: object
          properties: { options: { type: array, minItems: 2, items: { $ref: '#/components/schemas/AdminOption' } } }
    PublicExam:
      type: object
      required: [id, title, date, durationMinutes, passingMode, status, resultPublished, questions]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        durationMinutes: { type: integer, minimum: 1 }
        passingMode: { enum: [PERCENTAGE, MARKS] }
        passingPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
        passingMarks: { type: number, minimum: 0, nullable: true }
        status: { enum: [DRAFT, PUBLISHED, ARCHIVED] }
        resultPublished: { type: boolean }
        questions: { type: array, items: { $ref: '#/components/schemas/PublicQuestion' } }
    AdminExam:
      allOf:
        - $ref: '#/components/schemas/PublicExam'
        - type: object
          required: [eligibleCandidateIds]
          properties:
            eligibleCandidateIds: { type: array, items: { type: string } }
            questions: { type: array, items: { $ref: '#/components/schemas/AdminQuestion' } }
    WriteQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: { type: string }
        prompt: { type: string, minLength: 1 }
        marks: { type: number, exclusiveMinimum: 0, default: 1 }
        options:
          type: array
          minItems: 2
          items:
            type: object
            required: [id, label, isCorrect]
            properties:
              id: { type: string }
              label: { type: string, minLength: 1 }
              isCorrect: { type: boolean }
    ExamWriteRequest:
      type: object
      required: [title, date, durationMinutes, passingMode, questions]
      properties:
        title: { type: string, minLength: 1 }
        date: { type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$' }
        durationMinutes: { type: integer, minimum: 1 }
        passingMode: { enum: [PERCENTAGE, MARKS] }
        passingPercentage: { type: number, minimum: 0, maximum: 100 }
        passingMarks: { type: number, minimum: 0, nullable: true }
        eligibleCandidateIds: { type: array, items: { type: string } }
        questions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WriteQuestion' } }
    Attempt:
      type: object
      required: [id, examId, state, deadlineAt, warningCount, version, answers]
      properties:
        id: { type: string }
        examId: { type: string }
        state: { enum: [IN_PROGRESS, SUBMITTED, EXPIRED] }
        startedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        warningCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
        answers: { type: object, additionalProperties: { type: string } }
        sessionId: { type: string }
        questions: { type: array, items: { $ref: '#/components/schemas/PublicQuestion' } }
    AnswerSaveRequest:
      type: object
      required: [selectedOptionId]
      properties:
        selectedOptionId: { type: string }
        clientRevision: { type: integer, minimum: 0 }
    AnswerSaveResponse:
      type: object
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          required: [serverRevision, savedAt, attemptState]
          properties:
            serverRevision: { type: integer }
            savedAt: { type: string, format: date-time }
            attemptState: { type: string }
    MonitoringEventRequest:
      type: object
      required: [type]
      properties:
        type: { enum: [MULTIPLE_FACE, NO_FACE, CAMERA_LOST, TAB_HIDDEN] }
    MonitoringEventResponse:
      type: object
      properties:
        data:
          type: object
          required: [warningCount, state]
          properties:
            warningCount: { type: integer }
            state: { type: string }
    ResultResponse:
      type: object
      properties:
        data:
          type: object
          required: [attemptId, score, totalMarks, qualification, published]
          properties:
            attemptId: { type: string }
            score: { type: number }
            totalMarks: { type: number }
            qualification: { enum: [QUALIFIED, NOT_QUALIFIED] }
            published: { type: boolean }
    AdminResultsResponse:
      type: object
      properties:
        data:
          type: object
          required: [examId, resultPublished, attempts]
          properties:
            examId: { type: string }
            resultPublished: { type: boolean }
            attempts: { type: array, items: { type: object, additionalProperties: true } }
    Error:
      type: object
      required: [error, requestId]
      properties:
        requestId: { type: string }
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            detail: { type: string }
            requestId: { type: string }
  responses:
    ExamList:
      description: Public exam list
      content: { application/json: { schema: { type: object, required: [data, requestId], properties: { data: { type: array, items: { $ref: '#/components/schemas/PublicExam' } }, requestId: { type: string, format: uuid } } } } }
    PublicExam:
      description: Public exam
      content: { application/json: { schema: { type: object, required: [data, requestId], properties: { data: { $ref: '#/components/schemas/PublicExam' }, requestId: { type: string, format: uuid } } } } }
    AdminExamList:
      description: Administrator exam list
      content: { application/json: { schema: { type: object, required: [data, requestId], properties: { data: { type: array, items: { $ref: '#/components/schemas/AdminExam' } }, requestId: { type: string, format: uuid } } } } }
    AdminExam:
      description: Administrator exam
      content: { application/json: { schema: { type: object, required: [data, requestId], properties: { data: { $ref: '#/components/schemas/AdminExam' }, requestId: { type: string, format: uuid } } } } }
    Attempt:
      description: Candidate attempt
      content: { application/json: { schema: { type: object, required: [data, requestId], properties: { data: { $ref: '#/components/schemas/Attempt' }, requestId: { type: string, format: uuid } } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Not authorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found or not yet published, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: State, session, uniqueness, or deadline conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
